[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "neontolojay"
version = "2025.0.0b6"
authors = [
    {name = "Sean Bell"},
]
description = "A Python package for modelling data in a Neo4j graph database with Pydantic and Pandas. A fork of neontology with added support for non-unique primary keys."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Database",
]
dependencies = [
    "neo4j>=5.0,<6",
    "pydantic>=2.7,<3",
    "pandas>=2.0,<3",
    "python-dotenv>=1.0,<2",
    "Jinja2>=3.0,<4",
    "typing-extensions>=4.0,<5",
    "PyYAML>=6.0,<7",
]

[dependency-groups]
dev = [
    "black>=22.3",
    "coverage>=7.0,<8",
    "flake8>=4.0",
    "flake8-pyproject>=1.2.3",
    "isort>=5.10",
    "mkdocs>=1.0,<2",
    "mypy>=0.961",
    "pydocstyle[toml]>=6.1",
    "pytest>=8.1,<9",
    "pytest-benchmark>=4.0,<5",
    "pytest-cov>=3.0,<5",
    "ruff>=0.1.0,<1",
    "types-PyYAML>=6.0,<7",
]

[project.urls]
Homepage = "https://github.com/Forgen/neontolojay"
Repository = "https://github.com/Forgen/neontolojay"
Documentation = "https://neontology.readthedocs.io/"
"Bug Tracker" = "https://github.com/Forgen/neontolojay/issues"

[project.optional-dependencies]
grand = [
    "grand-cypher>=0.13.0",
    "networkx>=3.2.1",
]

all = [
    "neontolojay[grand]"
]

[tool.pytest.ini_options]
markers = [
    "uses_graph: marks tests that require access to neo4j (deselect with '-m \"not uses_graph\"')"
]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "ignore:Duplicate dictionary key PRACTICE_RELATIONSHIP"
]
log_cli = 1
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)"
log_cli_date_format = "%Y-%m-%d %H:%M:%s"
addopts = "--capture=tee-sys"

[tool.ruff]
line-length = 128

[tool.ruff.lint]
select = ["E", "F", "I", "W", "D"]
ignore = ["D100", "D101", "D104", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "neontology.*"
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "neo4j.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pandas.*"
ignore_missing_imports = true

[tool.isort]
profile = "black"

[tool.pydocstyle]
convention = "google"
add_ignore = ["D104", "D100", "D202", "D107", "D101", "D106"]

[tool.flake8]
max-line-length = 160
exclude = [
    ".git",
    "__pycache__",
    ".venv",
]
extend-ignore = []
